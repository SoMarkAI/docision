[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docision"
version = "0.2.1rc2"
description = "Local document decisions with Python, HTTP, MCP and Playground interfaces"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "deployment/THIRD_PARTY_NOTICES.md"]
dependencies = ["transformers==5.13.1", "torch==2.11.0", "torchvision==0.26.0", "accelerate==1.14.0", "safetensors==0.8.0", "Pillow>=10", "pypdfium2>=4.30,<6"]

[tool.setuptools.packages.find]
include = ["docision*"]

[tool.setuptools.package-data]
"docision.local_app" = ["assets/*.html", "assets/*.json"]

[project.scripts]
docision = "docision.commands:main"
docision-score = "docision.cli:main"
docision-serve = "docision.service:main"
Docision-serve = "docision.service:main"
docision-eval = "docision.evaluate:main"

[project.optional-dependencies]
server = []
mcp = ["mcp==1.30.0"]
Docision = []
test = ["pytest>=8,<9", "requests>=2.31"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
